services:
  app:
    image: ghcr.io/maxnumerique/velo-repar-lyon:latest
    restart: always
    expose:
      - "3000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf.prod:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started

  db:
    image: postgis/postgis:15-3.3
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER:-velo_admin}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-velo_pass}
      - POSTGRES_DB=${DB_NAME:-velodupelo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-velo_admin} -d ${DB_NAME:-velodupelo}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
