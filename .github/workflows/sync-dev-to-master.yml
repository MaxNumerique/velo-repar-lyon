name: Daily Sync Dev to Master

on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight
  workflow_dispatch: # Allow manual trigger for testing

permissions:
  contents: write

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync Dev → Master
        id: sync_to_master
        run: |
          echo "Synchronisation de Dev vers Master..."
          git fetch origin dev:dev
          git fetch origin master:master
          
          git checkout master
          
          if git merge-base --is-ancestor dev master; then
            echo "Master est déjà à jour avec Dev."
            echo "merged=false" >> $GITHUB_OUTPUT
          else
            echo "Fusion de Dev dans Master..."
            git merge dev --no-ff -m "chore: sync dev → master"
            git push origin master
            echo "merged=true" >> $GITHUB_OUTPUT
          fi

      - name: Sync Master → Dev (rapatrie les commits semantic-release)
        run: |
          echo "Synchronisation de Master vers Dev..."
          git fetch origin master:master
          git fetch origin dev:dev
          
          git checkout dev
          
          if git merge-base --is-ancestor master dev; then
            echo "Dev est déjà à jour avec Master."
          else
            echo "Fusion de Master dans Dev (récupération des commits de release)..."
            git merge master --no-ff -m "chore: sync master → dev [skip ci]"
            git push origin dev
          fi