name: Daily Sync Dev to Master

on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync Dev → Master
        id: sync_to_master
        run: |
          git fetch origin

          git checkout master

          if git merge-base --is-ancestor origin/dev master; then
            echo "merged=false" >> $GITHUB_OUTPUT
          else
            git merge origin/dev --no-ff -m "chore: sync dev → master"
            git push origin master
            echo "merged=true" >> $GITHUB_OUTPUT
          fi

      - name: Sync Master → Dev (rapatrie les commits semantic-release)
        run: |
          git fetch origin

          git checkout dev

          if git merge-base --is-ancestor origin/master dev; then
            echo "Dev is already up to date with master."
          else
            git merge origin/master --no-ff -m "chore: sync master -> dev [skip ci]"
            git push origin dev
          fi