name: Deploy to VPS

on:
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_CLERK_SIGN_IN_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
            NEXT_PUBLIC_CLERK_SIGN_UP_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_URL }}
            NEXT_PUBLIC_MAPTILER_KEY=${{ secrets.NEXT_PUBLIC_MAPTILER_KEY }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
            NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET=${{ secrets.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
            NEXT_PUBLIC_GOOGLE_MAPS_API=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API }}
            NEXT_PUBLIC_PUSHER_KEY=${{ secrets.NEXT_PUBLIC_PUSHER_KEY }}
            NEXT_PUBLIC_PUSHER_CLUSTER=${{ secrets.NEXT_PUBLIC_PUSHER_CLUSTER }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_URL }}
      NEXT_PUBLIC_MAPTILER_KEY: ${{ secrets.NEXT_PUBLIC_MAPTILER_KEY }}
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
      NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      NEXT_PUBLIC_GOOGLE_MAPS_API: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API }}
      GOOGLE_HOST: ${{ secrets.GOOGLE_HOST }}
      GOOGLE_PORT: ${{ secrets.GOOGLE_PORT }}
      GOOGLE_EMAIL: ${{ secrets.GOOGLE_EMAIL }}
      PASSWORD_APP: ${{ secrets.PASSWORD_APP }}
      PUSHER_APP_ID: ${{ secrets.PUSHER_APP_ID }}
      NEXT_PUBLIC_PUSHER_KEY: ${{ secrets.NEXT_PUBLIC_PUSHER_KEY }}
      PUSHER_SECRET: ${{ secrets.PUSHER_SECRET }}
      NEXT_PUBLIC_PUSHER_CLUSTER: ${{ secrets.NEXT_PUBLIC_PUSHER_CLUSTER }}
      BIKE_INDEX_APP_ID: ${{ secrets.BIKE_INDEX_APP_ID }}
      BIKE_INDEX_SECRET: ${{ secrets.BIKE_INDEX_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate .env file
        run: |
          cat <<EOF > .env
          DATABASE_URL=${{ env.DATABASE_URL }}
          CLERK_SECRET_KEY=${{ env.CLERK_SECRET_KEY }}
          CLOUDINARY_API_KEY=${{ env.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ env.CLOUDINARY_API_SECRET }}
          GOOGLE_HOST=${{ env.GOOGLE_HOST }}
          GOOGLE_PORT=${{ env.GOOGLE_PORT }}
          GOOGLE_EMAIL=${{ env.GOOGLE_EMAIL }}
          PASSWORD_APP="${{ env.PASSWORD_APP }}"
          PUSHER_APP_ID=${{ env.PUSHER_APP_ID }}
          PUSHER_SECRET=${{ env.PUSHER_SECRET }}
          BIKE_INDEX_APP_ID=${{ env.BIKE_INDEX_APP_ID }}
          BIKE_INDEX_SECRET=${{ env.BIKE_INDEX_SECRET }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL=${{ env.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
          NEXT_PUBLIC_CLERK_SIGN_UP_URL=${{ env.NEXT_PUBLIC_CLERK_SIGN_UP_URL }}
          NEXT_PUBLIC_MAPTILER_KEY=${{ env.NEXT_PUBLIC_MAPTILER_KEY }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ env.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET=${{ env.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
          NEXT_PUBLIC_GOOGLE_MAPS_API=${{ env.NEXT_PUBLIC_GOOGLE_MAPS_API }}
          NEXT_PUBLIC_PUSHER_KEY=${{ env.NEXT_PUBLIC_PUSHER_KEY }}
          NEXT_PUBLIC_PUSHER_CLUSTER=${{ env.NEXT_PUBLIC_PUSHER_CLUSTER }}
          EOF
          
          # Force database host to 'db' for production
          sed -i 's/@localhost/@db/g' .env
          echo "✅ .env file generated on runner."

      - name: Copy Config Files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml,nginx.conf.prod,.env"
          target: "/home/maxnumerique/apps/NodeApp"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: |
            DATABASE_URL
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
            CLERK_SECRET_KEY
            NEXT_PUBLIC_CLERK_SIGN_IN_URL
            NEXT_PUBLIC_CLERK_SIGN_UP_URL
            NEXT_PUBLIC_MAPTILER_KEY
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
            NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET
            CLOUDINARY_API_KEY
            CLOUDINARY_API_SECRET
            NEXT_PUBLIC_GOOGLE_MAPS_API
            GOOGLE_HOST
            GOOGLE_PORT
            GOOGLE_EMAIL
            PASSWORD_APP
            PUSHER_APP_ID
            NEXT_PUBLIC_PUSHER_KEY
            PUSHER_SECRET
            NEXT_PUBLIC_PUSHER_CLUSTER
            BIKE_INDEX_APP_ID
            BIKE_INDEX_SECRET
          script: |
            cd /home/maxnumerique/apps/NodeApp
            
            # Generate .env automatically & force database host to 'db'
            env | grep -E '^(NEXT_PUBLIC_|DATABASE_|CLERK_|CLOUDINARY_|GOOGLE_|PASSWORD_|PUSHER_|BIKE_INDEX_)' | sed 's/@localhost/@db/g' > .env
            
            # Simple Warning for DATABASE_URL
            if [[ "$DATABASE_URL" == *"localhost"* ]]; then
              echo "⚠️ WARNING: Changed DATABASE_URL host from localhost to db for production."
            fi

            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            
            # Zero-Downtime: scale up, wait for healthy, scale down
            docker compose -f docker-compose.prod.yml up -d --scale app=2 --no-recreate app
            
            echo "Waiting for healthy containers..."
            timeout 120s bash -c 'until [ $(docker compose -f docker-compose.prod.yml ps --filter "status=running" --filter "health=healthy" --format json | grep -c "app") -ge 2 ]; do sleep 5; done' || docker compose -f docker-compose.prod.yml logs --tail=50 app
            
            docker compose -f docker-compose.prod.yml up -d --scale app=1 --no-recreate app
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
