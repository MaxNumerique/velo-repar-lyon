name: CI & Release

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  commitlint:
    name: Semantic Commit Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Verify at least one semantic commit
        run: |
          COMMITS=$(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          PATTERN="^(feat|fix|perf|revert|refactor|chore|docs|style|test|build|ci)(\(.+\))?(!)?: .+"

          for commit in $COMMITS; do
            MESSAGE=$(git log -1 --format=%s "$commit")
            if echo "$MESSAGE" | grep -qE "$PATTERN"; then
              echo "✅ Semantic commit trouvé : $MESSAGE"
              exit 0
            fi
          done

          echo "❌ Aucun commit sémantique trouvé dans cette PR."
          echo "   Format attendu : type(scope?): description"
          echo "   Types valides : feat, fix, perf, revert, refactor, chore, docs, style, test, build, ci"
          exit 1

  test:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  release:
    name: Release
    needs: test
    if: github.event_name == 'push' && github.ref_name == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: npx semantic-release